<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Town and Country Admin</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo" href="/admin">🫘 Town and Country Admin</a>
      <div>
        <a href="/" class="btn">View store</a>
        <button id="logout" class="hidden">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <section id="login" class="panel" style="max-width: 360px; margin: 40px auto;">
      <h2>Admin login</h2>
      <form id="login-form">
        <label>Password <input type="password" name="password" required autofocus></label>
        <div id="login-msg"></div>
        <button class="btn-primary btn-block" type="submit">Log in</button>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <div class="stats" id="stats"></div>

      <div class="panel">
        <h2>Ordering</h2>
        <form id="settings-form">
          <label class="toggle"><input type="checkbox" name="ordersOpen"> Accept orders on the website</label>
          <label>Message shown while orders are paused <input name="closedMessage"></label>
          <div id="settings-msg"></div>
          <div><button class="btn-primary" type="submit">Save</button></div>
        </form>
      </div>

      <div class="panel">
        <h2>Orders</h2>
        <div class="table-wrap"><table id="orders"></table></div>
      </div>

      <div class="panel">
        <h2 id="product-form-title">Add product</h2>
        <form id="product-form">
          <input type="hidden" name="id">
          <div class="form-grid">
            <label>Name <input name="name" required></label>
            <label>Category
              <select name="category">
                <option value="beans">Beans</option>
                <option value="rice">Rice</option>
                <option value="combo" selected>Combo</option>
              </select>
            </label>
            <label>Icon (emoji) <input name="icon" placeholder="e.g. 🇲🇽"></label>
            <label>Package size <input name="weight" placeholder="e.g. 1 kg"></label>
            <label>Price ($) <input name="price" type="number" step="0.01" min="0.01" required></label>
            <label>Stock <input name="stock" type="number" step="1" min="0" required></label>
          </div>
          <label>Description <textarea name="description"></textarea></label>
          <div id="product-msg"></div>
          <div style="display:flex; gap:8px;">
            <button class="btn-primary" type="submit">Save product</button>
            <button type="button" id="cancel-edit" class="hidden">Cancel edit</button>
          </div>
        </form>
      </div>

      <div class="panel">
        <h2>Products</h2>
        <div class="table-wrap"><table id="products"></table></div>
      </div>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
